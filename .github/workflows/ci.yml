name: CPU checks and packaging
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev]'
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m build
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          agf verify --runtime
          agf config > training.yaml
          agf train --config training.yaml --dry-run
          python -m agf.utils.recipe --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-py${{ matrix.python }}
          path: dist/*
