stages: [test]

cpu-and-package:
  stage: test
  image: python:3.10-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: agf-python310
    paths: [.cache/pip]
  script:
    - python -m pip install --upgrade pip
    - python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
    - python -m pip install '.[dev]'
    - python -m pip check
    - python -m ruff check .
    - python -m pytest
    - python -m build
    - python -m pip install --force-reinstall --no-deps dist/*.whl
    - cd /tmp
    - agf verify --runtime
    - agf config > training.yaml
    - agf train --config training.yaml --dry-run
  artifacts:
    paths: [dist/]
