[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-gradient-forcing"
dynamic = ["version"]
description = "Adversarial history training for autoregressive video diffusion"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "torch==2.8.0",
  "diffusers==0.31.0",
  "transformers==5.14.1",
  "huggingface-hub==1.24.0",
  "numpy==1.26.4",
  "omegaconf>=2.3,<2.4",
  "einops>=0.8,<0.9",
  "ftfy>=6.2,<7",
  "regex>=2024.5.15",
  "sentencepiece>=0.2,<0.3",
  "imageio>=2.35,<3",
  "imageio-ffmpeg>=0.5,<0.7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
logging = ["wandb>=0.19,<1"]
dev = ["pytest>=8,<9", "build>=1.2,<2", "ruff>=0.12,<0.17"]

[project.scripts]
agf = "agf.utils.cli:main"

[tool.setuptools.dynamic]
version = {attr = "agf.__version__"}

[tool.setuptools]
# Keep the research modules visible at the repository root while installing
# them under one namespace, so other research projects can share an environment.
package-dir = {agf = "."}
packages = [
  "agf", "agf.model", "agf.pipeline", "agf.trainer", "agf.utils",
  "agf.wan", "agf.wan.modules", "agf.evaluation",
]
include-package-data = false

[tool.setuptools.package-data]
agf = ["configs/*.yaml", "prompts/*.txt", "prompts/*.md", "prompts/benchmark/*", "evaluation/requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
